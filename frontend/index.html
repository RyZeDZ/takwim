<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#001858" />
    <title>Department Timetables</title>
    <meta name="description" content="The department's timetable, always up to date: clash-free, with cancelled classes and extra sessions shown live. Works offline on any phone." />

    <!-- Link previews (WhatsApp, Telegram, Facebook, Messenger, Discord, X). frontend/server.js
         fills in the page's own title and the full address of each link when it serves the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Department Timetables" />
    <meta property="og:title" content="Department Timetables" />
    <meta property="og:description" content="The department's timetable, always up to date: clash-free, with cancelled classes and extra sessions shown live. Works offline on any phone." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A week timetable on a phone, with a cancelled class and a new session" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Theme and language before the first paint (no flash). Same rules as src/lib/i18n.tsx.
      try {
        var th = localStorage.getItem('theme') || 'auto'
        var dark = th === 'dark' || (th === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var lang = localStorage.getItem('lang') || (navigator.language || 'en').slice(0, 2)
        if (lang === 'ar') document.documentElement.dir = 'rtl'
        if (lang === 'fr' || lang === 'ar') document.documentElement.lang = lang
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This app needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
